[package]
name = "api-chat-app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.3"
chrono = "0.4.45"
dotenvy = "0.15.7"
hex = "0.4.3"
pbkdf2 = "0.13.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }
validator = { version = "0.21.0", features = ["derive"] }
